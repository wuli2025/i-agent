<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>演示文稿</title>
<style>
/* ============ 色板：明暗双通道 ============ */
:root {
  --bg: #f7f6f2;
  --fg: #1d2733;
  --muted: #66707c;
  --accent: #2c4661;
  --accent-soft: #e6ebf1;
  --line: #dcdcd6;
  --card: #ffffff;
  --shadow: 0 6px 30px rgba(29, 39, 51, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181e;
    --fg: #dde3ea;
    --muted: #8a95a3;
    --accent: #7fa3c4;
    --accent-soft: #1f2a36;
    --line: #2a323c;
    --card: #1a2028;
    --shadow: 0 6px 30px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="light"] {
  --bg: #f7f6f2; --fg: #1d2733; --muted: #66707c; --accent: #2c4661;
  --accent-soft: #e6ebf1; --line: #dcdcd6; --card: #ffffff;
  --shadow: 0 6px 30px rgba(29, 39, 51, .08);
}
:root[data-theme="dark"] {
  --bg: #14181e; --fg: #dde3ea; --muted: #8a95a3; --accent: #7fa3c4;
  --accent-soft: #1f2a36; --line: #2a323c; --card: #1a2028;
  --shadow: 0 6px 30px rgba(0, 0, 0, .35);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ============ 幻灯片舞台 ============ */
#deck { position: relative; width: 100vw; height: 100vh; }
.slide {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column;
  justify-content: center;
  padding: 6vh 9vw;
}
.slide.active { display: flex; animation: fadein .35s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.kicker {
  color: var(--accent);
  font-size: clamp(13px, 1.4vw, 18px);
  font-weight: 600;
  letter-spacing: .35em;
  margin-bottom: 2.2vh;
}
h1 {
  font-size: clamp(34px, 6vw, 84px);
  font-weight: 700;
  line-height: 1.22;
  letter-spacing: .01em;
}
h2 {
  font-size: clamp(26px, 4.2vw, 58px);
  font-weight: 700;
  line-height: 1.28;
}
.sub {
  margin-top: 3vh;
  font-size: clamp(16px, 2vw, 26px);
  color: var(--muted);
  line-height: 1.7;
}
ul.pts { list-style: none; margin-top: 4.5vh; }
ul.pts li {
  position: relative;
  font-size: clamp(19px, 2.6vw, 34px);
  line-height: 1.55;
  padding-left: 1.3em;
  margin-bottom: 2.6vh;
}
ul.pts li::before {
  content: "";
  position: absolute; left: 0; top: .62em;
  width: .5em; height: .18em;
  background: var(--accent);
  border-radius: 2px;
}

/* 封面 / 结尾 */
.slide.cover, .slide.end { align-items: flex-start; }
.slide.cover .rule, .slide.end .rule {
  width: 4.5em; height: 5px; background: var(--accent);
  border-radius: 3px; margin-bottom: 4vh;
}

/* 章节页 */
.slide.section { align-items: flex-start; }
.slide.section .secno {
  font-size: clamp(60px, 11vw, 160px);
  font-weight: 700;
  color: var(--accent-soft);
  -webkit-text-stroke: 2px var(--accent);
  line-height: 1;
  margin-bottom: 2vh;
}

/* 大数字页 */
.slide.big { align-items: center; text-align: center; }
.slide.big .bignum {
  font-size: clamp(72px, 15vw, 220px);
  font-weight: 700;
  color: var(--accent);
  line-height: 1.05;
  letter-spacing: -.01em;
}
.slide.big h2 { margin-top: 3.5vh; font-weight: 500; color: var(--fg); }

/* 对比页 */
.cmp-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3.5vw;
  margin-top: 4.5vh;
}
.cmp-col {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 3.5vh 2.5vw;
  box-shadow: var(--shadow);
}
.cmp-col h3 {
  font-size: clamp(18px, 2.2vw, 30px);
  color: var(--accent);
  margin-bottom: 2vh;
  padding-bottom: 1.4vh;
  border-bottom: 2px solid var(--accent-soft);
}
.cmp-col ul { list-style: none; }
.cmp-col li {
  font-size: clamp(15px, 1.8vw, 24px);
  line-height: 1.6;
  margin-bottom: 1.6vh;
  padding-left: 1.1em;
  position: relative;
}
.cmp-col li::before {
  content: ""; position: absolute; left: 0; top: .6em;
  width: .42em; height: .16em; background: var(--accent); border-radius: 2px;
}

/* 图文页 */
.slide.image .img-wrap {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 4vw;
  align-items: center;
  height: 100%;
}
.slide.image figure {
  width: 100%; aspect-ratio: 16 / 10;
  border-radius: 14px; overflow: hidden;
  box-shadow: var(--shadow);
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-soft) 130%);
  display: flex; align-items: center; justify-content: center;
}
.slide.image figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slide.image figure .ph {
  color: rgba(255,255,255,.7);
  font-size: clamp(13px, 1.4vw, 18px);
  letter-spacing: .3em;
}
.slide.image ul.pts li { font-size: clamp(17px, 2.1vw, 28px); }

/* 引言页 */
.slide.quote { align-items: center; text-align: center; }
.slide.quote blockquote {
  font-size: clamp(24px, 3.6vw, 52px);
  line-height: 1.6;
  font-weight: 500;
  max-width: 24em;
}
.slide.quote blockquote::before { content: "\201C"; color: var(--accent); margin-right: .1em; }
.slide.quote blockquote::after { content: "\201D"; color: var(--accent); margin-left: .1em; }
.slide.quote .cite {
  margin-top: 4vh;
  color: var(--muted);
  font-size: clamp(15px, 1.7vw, 22px);
}
.slide.quote .cite::before { content: "—— "; }

/* ============ 页码与进度 ============ */
#pageno {
  position: fixed; right: 3vw; bottom: 3.2vh;
  font-size: 14px; color: var(--muted);
  font-variant-numeric: tabular-nums;
  z-index: 5;
}
#progress {
  position: fixed; left: 0; bottom: 0;
  height: 3px; background: var(--accent);
  transition: width .3s ease;
  z-index: 5;
}

/* ============ 备注面板 ============ */
#notes {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--card);
  border-top: 2px solid var(--accent);
  padding: 16px 6vw 20px;
  font-size: 16px; line-height: 1.7;
  color: var(--fg);
  box-shadow: var(--shadow);
  display: none;
  z-index: 8;
  max-height: 32vh; overflow-y: auto;
}
#notes.show { display: block; }
#notes .nt-label {
  color: var(--accent); font-size: 12px;
  letter-spacing: .3em; margin-bottom: 6px;
}

/* ============ 缩略图总览 ============ */
#overview {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 20;
  display: none;
  overflow-y: auto;
  padding: 5vh 5vw;
}
#overview.show { display: block; }
#overview .grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 18px;
}
.thumb {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  aspect-ratio: 16 / 9;
  padding: 14px;
  cursor: pointer;
  overflow: hidden;
  transition: border-color .15s, transform .15s;
  position: relative;
}
.thumb:hover { border-color: var(--accent); transform: translateY(-2px); }
.thumb.cur { border: 2px solid var(--accent); }
.thumb .t-type {
  font-size: 10px; color: var(--accent);
  letter-spacing: .2em; margin-bottom: 6px; text-transform: uppercase;
}
.thumb .t-title {
  font-size: 13px; font-weight: 600; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.thumb .t-no {
  position: absolute; right: 10px; bottom: 8px;
  font-size: 11px; color: var(--muted);
}
#overview .ov-tip {
  text-align: center; color: var(--muted);
  font-size: 13px; margin-bottom: 3vh; letter-spacing: .1em;
}

/* ============ 打印：每页一张 A4 横版 ============ */
@page { size: A4 landscape; margin: 0; }
@media print {
  body { overflow: visible; background: #fff; }
  :root, :root[data-theme="dark"] {
    --bg: #ffffff; --fg: #1d2733; --muted: #66707c; --accent: #2c4661;
    --accent-soft: #e6ebf1; --line: #dcdcd6; --card: #ffffff; --shadow: none;
  }
  #deck { width: auto; height: auto; }
  .slide {
    display: flex !important;
    position: relative;
    width: 297mm; height: 209mm;
    page-break-after: always;
    break-inside: avoid;
    padding: 18mm 24mm;
    animation: none;
  }
  #pageno, #progress, #notes, #overview { display: none !important; }
}
</style>
</head>
<body>

<div id="deck"></div>
<div id="pageno"></div>
<div id="progress"></div>
<div id="notes"><div class="nt-label">演讲备注（按 N 关闭）</div><div id="notes-body"></div></div>
<div id="overview"><div class="ov-tip">点击任意页跳转，Esc 返回</div><div class="grid" id="ov-grid"></div></div>

<script>
"use strict";

/* ================================================================
   SLIDES 数据：制作 PPT 时只需替换本数组。
   字段说明：
     type   : cover | section | points | big | compare | image | quote | end
     title  : 页标题（观点句）
     points : 要点数组，最多 3 条（cover/end 用 points[0] 作副标题）
     big    : 大数字页的数字或短语
     img    : 图文页图片相对路径，留空显示渐变占位
     left / right : 对比页两栏，各含 { title, points }
     quote  : 引言页引文
     note   : 演讲者备注（按 N 显示）
   ================================================================ */
const SLIDES = [
  {
    type: "cover",
    title: "让每一次汇报都掷地有声",
    points: ["投影式演示方法 · 演示者 张三 · 2026 年 7 月"],
    note: "开场 30 秒：自我介绍，说明今天讲三件事——问题、方法、结果。"
  },
  {
    type: "section",
    title: "为什么大多数 PPT 没人看",
    points: ["先看三个常见误区"],
    note: "过渡页，停留 5 秒即可，抛出悬念。"
  },
  {
    type: "points",
    title: "信息过载是投影的天敌",
    points: [
      "一页塞进八条要点，等于零条",
      "观众读字时就不会听你说话",
      "备注该给自己看，不该上屏"
    ],
    note: "举例：上季度评审会那份 47 页的 PPT，平均每页 120 个字。"
  },
  {
    type: "big",
    title: "观众对单页幻灯片的平均注视时间",
    big: "8 秒",
    note: "强调：8 秒读不完三行以上的文字，所以必须做减法。"
  },
  {
    type: "compare",
    title: "文档思维与投影思维的分野",
    left: {
      title: "文档式（错误示范）",
      points: ["段落长文塞满页面", "表格截图直接贴入", "标题只写话题词"]
    },
    right: {
      title: "投影式（推荐做法）",
      points: ["一屏一意，三行封顶", "关键数字放大呈现", "标题直接给出观点"]
    },
    note: "左边念一条右边对一条，节奏放慢。"
  },
  {
    type: "image",
    title: "配图统一风格，画面自己会说话",
    points: ["全套只用一种插画风格", "16:9 构图，画面不含文字"],
    img: "",
    note: "此页图片留空演示占位效果；实际使用时填 assets/img/img-06.png。"
  },
  {
    type: "quote",
    title: "本杰明·富兰克林",
    quote: "告诉我，我会忘记；给我看，我会记住；让我参与，我才能理解。",
    note: "引出下一步：把方法用到下周的路演里。"
  },
  {
    type: "end",
    title: "少即是多，开始你的下一份演示",
    points: ["联系我们 · slides@example.com"],
    note: "结尾留联系方式，等待提问。"
  }
];

/* ================ 渲染 ================ */
const deck = document.getElementById("deck");
const pageno = document.getElementById("pageno");
const progress = document.getElementById("progress");
const notesPanel = document.getElementById("notes");
const notesBody = document.getElementById("notes-body");
const overview = document.getElementById("overview");
const ovGrid = document.getElementById("ov-grid");

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function ptsHtml(points, max) {
  const arr = (points || []).slice(0, max || 3);
  if (!arr.length) return "";
  return '<ul class="pts">' + arr.map(p => "<li>" + esc(p) + "</li>").join("") + "</ul>";
}

function colHtml(col) {
  col = col || {};
  const lis = (col.points || []).map(p => "<li>" + esc(p) + "</li>").join("");
  return '<div class="cmp-col"><h3>' + esc(col.title) + "</h3><ul>" + lis + "</ul></div>";
}

function renderSlide(s, i) {
  const secIdx = SLIDES.slice(0, i + 1).filter(x => x.type === "section").length;
  let inner = "";
  switch (s.type) {
    case "cover":
      inner = '<div class="rule"></div><h1>' + esc(s.title) + "</h1>" +
        (s.points && s.points[0] ? '<p class="sub">' + esc(s.points[0]) + "</p>" : "");
      break;
    case "section":
      inner = '<div class="secno">' + String(secIdx).padStart(2, "0") + "</div>" +
        "<h1>" + esc(s.title) + "</h1>" +
        (s.points && s.points[0] ? '<p class="sub">' + esc(s.points[0]) + "</p>" : "");
      break;
    case "points":
      inner = '<div class="kicker">要点</div><h2>' + esc(s.title) + "</h2>" + ptsHtml(s.points, 3);
      break;
    case "big":
      inner = '<div class="bignum">' + esc(s.big) + "</div><h2>" + esc(s.title) + "</h2>";
      break;
    case "compare":
      inner = "<h2>" + esc(s.title) + '</h2><div class="cmp-wrap">' +
        colHtml(s.left) + colHtml(s.right) + "</div>";
      break;
    case "image": {
      const fig = s.img
        ? '<img src="' + esc(s.img) + '" alt="' + esc(s.title) + '" onerror="this.outerHTML=\'<span class=&quot;ph&quot;>插图占位</span>\'">'
        : '<span class="ph">插图占位</span>';
      inner = '<div class="img-wrap"><figure>' + fig + "</figure><div><h2>" +
        esc(s.title) + "</h2>" + ptsHtml(s.points, 2) + "</div></div>";
      break;
    }
    case "quote":
      inner = "<blockquote>" + esc(s.quote) + '</blockquote><div class="cite">' + esc(s.title) + "</div>";
      break;
    case "end":
      inner = '<div class="rule"></div><h1>' + esc(s.title) + "</h1>" +
        (s.points && s.points[0] ? '<p class="sub">' + esc(s.points[0]) + "</p>" : "");
      break;
    default:
      inner = "<h2>" + esc(s.title || "未命名页") + "</h2>" + ptsHtml(s.points, 3);
  }
  const sec = document.createElement("section");
  sec.className = "slide " + esc(s.type || "points");
  sec.innerHTML = inner;
  return sec;
}

SLIDES.forEach((s, i) => deck.appendChild(renderSlide(s, i)));

/* 缩略图总览 */
const TYPE_NAME = {
  cover: "封面", section: "章节", points: "要点", big: "大数字",
  compare: "对比", image: "图文", quote: "引言", end: "结尾"
};
SLIDES.forEach((s, i) => {
  const t = document.createElement("div");
  t.className = "thumb";
  t.innerHTML = '<div class="t-type">' + (TYPE_NAME[s.type] || s.type) + "</div>" +
    '<div class="t-title">' + esc(s.title || s.quote || "") + "</div>" +
    '<div class="t-no">' + (i + 1) + "</div>";
  t.addEventListener("click", () => { hideOverview(); goto(i); });
  ovGrid.appendChild(t);
});

/* ================ 翻页控制 ================ */
let cur = 0;
const slides = deck.querySelectorAll(".slide");

function goto(n) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, n));
  slides.forEach((el, i) => el.classList.toggle("active", i === cur));
  pageno.textContent = (cur + 1) + " / " + SLIDES.length;
  progress.style.width = ((cur + 1) / SLIDES.length * 100) + "%";
  notesBody.textContent = SLIDES[cur].note || "（本页无备注）";
  ovGrid.querySelectorAll(".thumb").forEach((el, i) => el.classList.toggle("cur", i === cur));
  location.hash = "#" + (cur + 1);
}
function next() { goto(cur + 1); }
function prev() { goto(cur - 1); }

function showOverview() { overview.classList.add("show"); }
function hideOverview() { overview.classList.remove("show"); }

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    overview.classList.contains("show") ? hideOverview() : showOverview();
    return;
  }
  if (overview.classList.contains("show")) return;
  switch (e.key) {
    case "ArrowRight": case "ArrowDown": case " ": case "PageDown":
      e.preventDefault(); next(); break;
    case "ArrowLeft": case "ArrowUp": case "PageUp":
      e.preventDefault(); prev(); break;
    case "Home": goto(0); break;
    case "End": goto(SLIDES.length - 1); break;
    case "n": case "N": notesPanel.classList.toggle("show"); break;
  }
});

deck.addEventListener("click", e => {
  if (overview.classList.contains("show")) return;
  const x = e.clientX / window.innerWidth;
  x < 0.25 ? prev() : next();
});

/* 支持 #页码 直达与刷新保持 */
const hashN = parseInt(location.hash.slice(1), 10);
goto(isNaN(hashN) ? 0 : hashN - 1);
</script>
</body>
</html>
