<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>视觉小说引擎模板</title>
<style>
/* ============================================================
   视觉小说引擎 · 样式层
   主色墨蓝 #2c4661，衬线标题，半透明模糊对话框
   明暗自适应：prefers-color-scheme
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --ink:#2c4661;            /* 主色：墨蓝 */
  --ink-strong:#1d3145;
  --accent:#8a6f4b;         /* 点缀：赭金 */
  --bg:#efece4;
  --text:#26282e;
  --dim:#6b6f78;
  --paper:rgba(252,250,245,.78);   /* 对话框纸面 */
  --panel-bg:rgba(252,250,245,.94);
  --line:rgba(44,70,97,.28);
  --good:#3d7a55;
  --bad:#9c4a3c;
  --btn-fg:#f5f2ea;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#7d9cbc;
    --ink-strong:#a8c2dc;
    --bg:#12161d;
    --text:#e8e4da;
    --dim:#98a0ab;
    --paper:rgba(15,21,29,.74);
    --panel-bg:rgba(17,23,32,.95);
    --line:rgba(150,175,200,.28);
    --btn-fg:#101720;
  }
}

html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.serif{font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif}

#app{
  position:relative;
  height:100vh;height:100dvh;
  max-width:960px;
  margin:0 auto;
  overflow:hidden;
  box-shadow:0 0 46px rgba(0,0,0,.28);
}

/* ---------- 三块屏幕：标题 / 游戏 / 结局 ---------- */
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}

/* ---------- 标题屏 ---------- */
#title-screen{display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#title-screen.active{display:flex}
#title-name{
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  font-size:clamp(34px,7vw,56px);
  letter-spacing:.35em;text-indent:.35em;
  color:#f5f2ea;
  text-shadow:0 3px 18px rgba(0,0,0,.45);
  margin-bottom:4px;
}
#title-author{color:rgba(245,242,234,.82);font-size:14px;letter-spacing:.2em;margin-bottom:26px}
#title-hint{color:rgba(245,242,234,.6);font-size:12px;margin-top:26px;letter-spacing:.1em}

.btn{
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  font-size:16px;letter-spacing:.3em;text-indent:.3em;
  padding:11px 40px;
  color:#f5f2ea;
  background:rgba(0,0,0,.22);
  border:1px solid rgba(245,242,234,.55);
  border-radius:4px;
  cursor:pointer;
  transition:background .25s,transform .25s;
}
.btn:hover{background:rgba(245,242,234,.18);transform:translateY(-2px)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--btn-fg)}
.btn.solid:hover{background:var(--ink-strong);border-color:var(--ink-strong)}

/* ---------- 游戏屏：背景双层，用于转场 ---------- */
#bg-a,#bg-b{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  opacity:0;
}
.bg.on{opacity:1}
.bg.t-fade{animation:bg-fade .8s ease both}
@keyframes bg-fade{from{opacity:0}to{opacity:1}}
.bg.t-slide{animation:bg-slide .7s cubic-bezier(.22,.61,.36,1) both}
@keyframes bg-slide{from{opacity:0;transform:translateX(6%)}to{opacity:1;transform:none}}
/* 径向水墨扩散：clip-path 圆形张开 + 微糊边缘 */
.bg.t-ink{animation:bg-ink 1.05s ease-in-out both}
@keyframes bg-ink{
  from{opacity:1;clip-path:circle(0% at 50% 55%);filter:blur(3px)}
  60%{filter:blur(1.5px)}
  to{opacity:1;clip-path:circle(142% at 50% 55%);filter:blur(0)}
}

/* ---------- 立绘槽位：左 / 中 / 右，无图不占位 ---------- */
#sprites{position:absolute;inset:0;pointer-events:none;z-index:5}
.sprite{
  position:absolute;bottom:23%;
  max-height:62vh;max-width:42%;
  display:none;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.35));
}
.sprite.show{display:block;animation:sprite-in .45s ease both}
@keyframes sprite-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#sp-left{left:2%}
#sp-center{left:50%;transform:translateX(-50%)}
#sp-center.show{animation:sprite-in-c .45s ease both}
@keyframes sprite-in-c{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%)}}
#sp-right{right:2%}

/* ---------- 对话框 ---------- */
#dialog{
  position:absolute;left:12px;right:12px;bottom:12px;
  min-height:172px;
  background:var(--paper);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);
  border-radius:10px;
  padding:20px 22px 28px;
  cursor:pointer;
  z-index:10;
}
#dialog.shake{animation:fx-shake .45s}
@keyframes fx-shake{
  0%,100%{transform:none}
  20%{transform:translate(-7px,2px)}
  40%{transform:translate(6px,-3px)}
  60%{transform:translate(-5px,2px)}
  80%{transform:translate(4px,-1px)}
}
#namebox{
  position:absolute;top:-16px;left:18px;
  display:none;
  padding:4px 18px;
  background:var(--ink);color:var(--btn-fg);
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  font-size:15px;letter-spacing:.2em;text-indent:.2em;
  border-radius:5px;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
#namebox.show{display:inline-block}
#dlg-text{
  white-space:pre-wrap;
  line-height:1.95;
  font-size:16.5px;
  min-height:86px;
  margin-top:6px;
}
#next-hint{
  position:absolute;right:18px;bottom:10px;
  font-size:12px;color:var(--ink);
  opacity:0;transition:opacity .3s;
}
#next-hint.show{opacity:1;animation:hint-blink 1.2s ease-in-out infinite}
@keyframes hint-blink{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- 选项 ---------- */
#choices{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:215px;
  width:min(560px,92%);
  display:none;flex-direction:column;gap:10px;
  z-index:15;
}
#choices.show{display:flex}
.choice{
  padding:12px 18px;
  background:var(--panel-bg);
  border:1px solid var(--line);
  border-left:3px solid var(--ink);
  border-radius:8px;
  color:var(--text);
  font-size:15.5px;line-height:1.5;
  text-align:left;
  cursor:pointer;
  transition:transform .2s,border-color .2s,background .2s;
  animation:choice-in .35s ease both;
}
.choice:nth-child(2){animation-delay:.07s}
.choice:nth-child(3){animation-delay:.14s}
.choice:nth-child(4){animation-delay:.21s}
@keyframes choice-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.choice:hover:not(:disabled){transform:translateX(5px);border-left-color:var(--accent)}
.choice.locked{opacity:.45;cursor:not-allowed}
.choice.locked:hover{transform:none}

/* ---------- 右上角数值面板 ---------- */
#hud-btn{
  position:absolute;top:12px;right:12px;z-index:30;
  padding:7px 16px;
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  font-size:13px;letter-spacing:.2em;text-indent:.2em;
  color:var(--ink);
  background:var(--panel-bg);
  border:1px solid var(--line);border-radius:20px;
  cursor:pointer;
}
#panel{
  position:absolute;top:54px;right:12px;z-index:30;
  width:238px;max-height:70vh;overflow-y:auto;
  background:var(--panel-bg);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:10px;
  padding:12px 14px 14px;
  display:none;
}
#panel.show{display:block;animation:choice-in .25s ease both}
.p-sec{
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  font-size:12.5px;letter-spacing:.25em;color:var(--ink);
  border-bottom:1px solid var(--line);
  padding-bottom:3px;margin:10px 0 4px;
}
.p-sec:first-child{margin-top:0}
.p-row{display:flex;justify-content:space-between;font-size:13.5px;margin-top:7px}
.p-val{color:var(--ink);font-weight:600}
.p-bar{height:5px;background:rgba(128,128,128,.18);border-radius:3px;overflow:hidden;margin-top:3px}
.p-bar i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .5s ease}
.p-tag{
  display:inline-block;padding:2px 10px;margin:5px 5px 0 0;
  border:1px solid var(--line);border-radius:20px;
  font-size:12px;color:var(--ink);
}
.p-none{font-size:12px;color:var(--dim)}

/* ---------- 数值变化飘字 ---------- */
#toasts{
  position:absolute;top:56px;right:16px;z-index:40;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;
  pointer-events:none;
}
.toast{
  padding:5px 13px;
  background:var(--panel-bg);
  border:1px solid var(--line);border-radius:16px;
  font-size:13px;
  animation:toast-up 1.6s ease forwards;
}
.toast.pos{color:var(--good)}
.toast.neg{color:var(--bad)}
@keyframes toast-up{
  0%{opacity:0;transform:translateY(8px)}
  12%{opacity:1;transform:none}
  72%{opacity:1}
  100%{opacity:0;transform:translateY(-16px)}
}

/* ---------- 闪白强调 ---------- */
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
#flash.go{animation:fx-flash .5s ease}
@keyframes fx-flash{0%{opacity:0}18%{opacity:.9}100%{opacity:0}}

/* ---------- 检定弹窗 ---------- */
#check-modal{
  position:absolute;inset:0;z-index:60;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);
}
#check-modal.show{display:flex}
.check-card{
  width:min(360px,86%);
  background:var(--panel-bg);
  border:1px solid var(--line);border-radius:12px;
  padding:26px 24px;text-align:center;
  animation:choice-in .3s ease both;
}
#check-title{
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  font-size:19px;letter-spacing:.25em;color:var(--ink);margin-bottom:14px;
}
#check-detail{font-size:14px;color:var(--dim);margin-bottom:10px;line-height:1.7}
#check-result{
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  font-size:22px;letter-spacing:.3em;text-indent:.3em;margin-bottom:18px;
}
#check-result.ok{color:var(--good)}
#check-result.bad{color:var(--bad)}
#check-go{border-color:var(--ink);color:var(--ink);background:transparent}
#check-go:hover{background:var(--ink);color:var(--btn-fg)}

/* ---------- 快进提示 ---------- */
#fast-tip{
  position:absolute;top:12px;left:12px;z-index:30;
  padding:5px 14px;font-size:12px;letter-spacing:.15em;
  color:var(--ink);background:var(--panel-bg);
  border:1px solid var(--line);border-radius:16px;
  display:none;
}
#fast-tip.show{display:block}

/* ---------- 结局屏 ---------- */
#ending-screen{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-align:center;padding:28px 22px;
  overflow-y:auto;
}
#ending-screen.active{display:flex}
#end-kicker{font-size:12px;letter-spacing:.5em;text-indent:.5em;color:rgba(245,242,234,.7)}
#end-title{
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  font-size:clamp(28px,6vw,44px);
  letter-spacing:.3em;text-indent:.3em;
  color:#f5f2ea;
  text-shadow:0 3px 16px rgba(0,0,0,.45);
}
#end-body{
  max-width:560px;
  color:rgba(245,242,234,.92);
  font-size:15.5px;line-height:2;
  white-space:pre-wrap;
}
#end-recap{
  width:min(420px,92%);
  background:rgba(0,0,0,.28);
  border:1px solid rgba(245,242,234,.3);
  border-radius:10px;
  padding:14px 18px;
  color:#f0ede4;
  text-align:left;
  font-size:13.5px;line-height:1.9;
}
#end-recap .r-sec{
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  letter-spacing:.25em;font-size:12.5px;
  color:rgba(245,242,234,.75);
  border-bottom:1px solid rgba(245,242,234,.25);
  padding-bottom:2px;margin:8px 0 4px;
}
#end-recap .r-sec:first-child{margin-top:0}
#end-btns{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;justify-content:center}

/* ---------- 移动端适配 ---------- */
@media (max-width:640px){
  #dialog{left:8px;right:8px;bottom:8px;min-height:150px;padding:16px 15px 24px}
  #dlg-text{font-size:15px;line-height:1.85;min-height:72px}
  #choices{bottom:180px;gap:8px}
  .choice{font-size:14.5px;padding:11px 14px}
  #panel{width:200px}
  .sprite{max-width:58%;max-height:52vh;bottom:26%}
  .btn{padding:10px 30px;font-size:15px}
}

/* ---------- 无障碍：动效降级 ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>
<div id="app">

  <!-- 标题屏 -->
  <div id="title-screen" class="screen">
    <div id="title-name"></div>
    <div id="title-author"></div>
    <button class="btn" id="btn-start">开始</button>
    <button class="btn" id="btn-continue">继续</button>
    <div id="title-hint">单击推进 · 双击画面或按住 Ctrl 快进 · 自动存档</div>
  </div>

  <!-- 游戏屏 -->
  <div id="game-screen" class="screen">
    <div id="bg-a" class="bg"></div>
    <div id="bg-b" class="bg"></div>
    <div id="sprites">
      <img id="sp-left" class="sprite" alt="">
      <img id="sp-center" class="sprite" alt="">
      <img id="sp-right" class="sprite" alt="">
    </div>
    <div id="fast-tip">快进中 · 双击画面关闭</div>
    <button id="hud-btn">属性</button>
    <div id="panel"><div id="panel-body"></div></div>
    <div id="toasts"></div>
    <div id="choices"></div>
    <div id="dialog">
      <div id="namebox"></div>
      <div id="dlg-text"></div>
      <div id="next-hint">继续</div>
    </div>
    <div id="flash"></div>
    <div id="check-modal">
      <div class="check-card">
        <div id="check-title"></div>
        <div id="check-detail"></div>
        <div id="check-result"></div>
        <button class="btn" id="check-go">继续</button>
      </div>
    </div>
  </div>

  <!-- 结局屏 -->
  <div id="ending-screen" class="screen">
    <div id="end-kicker">结局</div>
    <div id="end-title"></div>
    <div id="end-body"></div>
    <div id="end-recap"></div>
    <div id="end-btns">
      <button class="btn solid" id="btn-restart">重新开始</button>
      <button class="btn" id="btn-title">回到标题</button>
    </div>
  </div>

</div>

<script>
/* ============================================================
   GAME 数据对象 —— agent 只需整体替换这个对象即可产出新游戏
   ============================================================
   meta      : 标题 / 作者 / 封面渐变（cover 也是标题屏和结局屏背景）
   config    : typeSpeed 打字机毫秒每字；condMode 条件不满足时选项的
               默认处理（"hide" 隐藏 / "gray" 置灰显示）；transition 默认转场
   start     : 起始场景 id
   stats     : 属性定义数组 {key, name, init 初始值, max 上限}，引擎钳位到 [0,max]
   affinity  : 好感定义数组 {key 角色标识, name 显示名, init 初始好感}
   flags     : 旗标定义数组 {key, name}，运行时初始均为 false
   scenes    : 场景数组，字段：
       id         场景唯一标识
       bg         背景：CSS 渐变字符串 或 图片路径（含 gradient( 即视为渐变）
                  省略则沿用上一场景背景
       transition 转场："fade" 淡入 / "slide" 横移 / "ink" 径向水墨扩散
       speaker    说话人名牌文字；省略即旁白（不显示名牌）
       text       正文；\n 换行；文内可嵌 [shake]（对话框震动）与
                  [flash]（画面闪白）两个强调标记，打到该处即触发
       effects    进场即生效的数值变化（每次进入该场景都会生效）
       sprites    立绘槽位 {left, center, right}，值为图片路径，null 清空该位；
                  省略整个字段则沿用上一场景立绘
       choices    选项数组，字段：
           text     选项文字
           cond     条件表达式字符串，可用 stats.X / affinity.X / flags.X
           condMode 覆盖全局的 "hide"/"gray"
           effects  数值变化：键先匹配 stats、再匹配 affinity，
                    都不是则视为旗标并赋布尔值，如 {"剑心":10,"残卷":true}
           goto     目标场景 id；写 "END" 触发结局裁定
           check    属性检定 {stat, difficulty 难度, rand 随机骰上限,
                    success 成功跳转 id, fail 失败跳转 id,
                    successEffects/failEffects 可选}；有 check 时忽略 goto
       next       无选项场景的直连目标 id；写 "END" 触发结局裁定
   endings   : 结局数组 {id, title, body 正文, cond 条件表达式, weight 权重}
               裁定规则：goto "END" 时逐条求值 cond，满足者中取 weight 最高。
               务必保留一条 cond:"true"、weight:1 的兜底结局。
   ============================================================ */
const GAME = {
  meta: {
    title: "青冥问剑",
    author: "i-agent 示例剧本",
    cover: "linear-gradient(160deg,#141f2c 0%,#2c4661 55%,#6e8ca8 100%)"
  },

  config: {
    typeSpeed: 30,
    condMode: "hide",
    transition: "fade"
  },

  start: "s1",

  stats: [
    { key: "剑心", name: "剑心", init: 20, max: 100 },
    { key: "悟性", name: "悟性", init: 20, max: 100 },
    { key: "体魄", name: "体魄", init: 20, max: 100 }
  ],

  affinity: [
    { key: "沈青芜", name: "沈青芜", init: 0 },
    { key: "顾长渊", name: "顾长渊", init: 0 }
  ],

  flags: [
    { key: "残卷", name: "无名残卷" },
    { key: "真相", name: "识破阴谋" }
  ],

  scenes: [
    {
      id: "s1",
      bg: "linear-gradient(180deg,#8fa8bf 0%,#5a7590 45%,#3a5570 100%)",
      transition: "ink",
      text: "云雾自山腰漫上来，青冥山的石阶在脚下延伸，望不见尽头。\n你背着一柄旧剑，走完了三千级台阶，山门前的古钟恰好敲响。\n今日，是青冥剑宗收徒的日子。",
      next: "s2"
    },
    {
      id: "s2",
      bg: "linear-gradient(180deg,#b9c6cf 0%,#7e93a6 55%,#4c6880 100%)",
      speaker: "执事长老",
      text: "入我青冥，先择其道。剑、经、体，三途各有所成，你要从哪一途起步？",
      choices: [
        { text: "拜入剑堂，日日抚剑", effects: { "剑心": 10 }, goto: "s3" },
        { text: "入藏经阁，遍读道藏", effects: { "悟性": 10 }, goto: "s3" },
        { text: "上锻体崖，打熬筋骨", effects: { "体魄": 10 }, goto: "s3" }
      ]
    },
    {
      id: "s3",
      bg: "linear-gradient(180deg,#a7bfae 0%,#6f8f7d 55%,#40604f 100%)",
      speaker: "沈青芜",
      text: "后山竹林里，一位白衣女子正在练剑，剑光如水。见你驻足，她收剑回身。\n「新来的师弟？我是沈青芜。你的站桩姿势不对，要指点你两招吗？」",
      choices: [
        { text: "虚心请教剑法", effects: { "沈青芜": 10, "剑心": 5 }, goto: "s4" },
        { text: "婉谢好意，独自苦修", effects: { "剑心": 10 }, goto: "s4" }
      ]
    },
    {

/* ============================================================
   引擎层 —— 以下代码与具体游戏无关，替换 GAME 时不要改动
   ============================================================ */
(function () {
  "use strict";

  var $ = function (s) { return document.querySelector(s); };
  var CFG = GAME.config || {};
  var SAVE_KEY = "vn_save_" + (GAME.meta.title || "untitled");

  /* 场景索引 */
  var sceneMap = {};
  GAME.scenes.forEach(function (s) { sceneMap[s.id] = s; });

  /* 运行时状态 */
  var S = null;          /* {scene, stats, affinity, flags} */
  var cur = null;        /* 当前场景对象 */
  var seq = 0;           /* 场景序号，防异步回调窜台 */

  /* 打字机状态 */
  var typing = false, typeTimer = null, typeCb = null, pendingPlain = "";

  /* 快进状态 */
  var fastHold = false, fastToggle = false;
  function isFast() { return fastHold || fastToggle; }

  /* 背景双层 */
  var bgLayers = [$("#bg-a"), $("#bg-b")], bgActive = 0;

  /* ---------- 状态初始化 / 存档 ---------- */
  function newState() {
    var st = { scene: GAME.start || GAME.scenes[0].id, stats: {}, affinity: {}, flags: {} };
    (GAME.stats || []).forEach(function (d) { st.stats[d.key] = d.init || 0; });
    (GAME.affinity || []).forEach(function (d) { st.affinity[d.key] = d.init || 0; });
    (GAME.flags || []).forEach(function (f) { st.flags[flagKey(f)] = false; });
    return st;
  }
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  }
  function loadSave() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var st = JSON.parse(raw);
      if (!st || !sceneMap[st.scene]) return null;
      return st;
    } catch (e) { return null; }
  }
  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  }

  /* ---------- 旗标定义兼容：支持 {key,name} 或纯字符串 ---------- */
  function flagKey(f) { return typeof f === "string" ? f : f.key; }
  function flagName(k) {
    var defs = GAME.flags || [];
    for (var i = 0; i < defs.length; i++) {
      if (flagKey(defs[i]) === k) {
        return (typeof defs[i] === "string") ? defs[i] : (defs[i].name || defs[i].key);
      }
    }
    return k;
  }

  /* ---------- 条件表达式求值：new Function 限定作用域 ---------- */
  function evalCond(expr) {
    if (!expr) return true;
    try {
      return !!(new Function("stats", "affinity", "flags", "return (" + expr + ")"))(
        S.stats, S.affinity, S.flags
      );
    } catch (e) {
      console.warn("条件求值失败: " + expr, e);
      return false;
    }
  }

  /* ---------- 数值变化：stats -> affinity -> flags 依次匹配 ---------- */
  function applyEffects(eff) {
    if (!eff) return;
    Object.keys(eff).forEach(function (k) {
      var v = eff[k];
      if (S.stats.hasOwnProperty(k)) {
        var def = null;
        (GAME.stats || []).forEach(function (d) { if (d.key === k) def = d; });
        var max = (def && def.max) || 100;
        S.stats[k] = Math.max(0, Math.min(max, S.stats[k] + v));
        toast((v >= 0 ? "+" : "") + v + " " + ((def && def.name) || k), v >= 0);
      } else if (S.affinity.hasOwnProperty(k)) {
        var adef = null;
        (GAME.affinity || []).forEach(function (d) { if (d.key === k) adef = d; });
        S.affinity[k] += v;
        toast((v >= 0 ? "+" : "") + v + " " + ((adef && adef.name) || k) + "好感", v >= 0);
      } else {
        S.flags[k] = !!v;
        toast((v ? "获得 · " : "失去 · ") + flagName(k), !!v);
      }
    });
    renderPanel();
  }

  /* ---------- 飘字提示 ---------- */
  function toast(text, positive) {
    var el = document.createElement("div");
    el.className = "toast " + (positive ? "pos" : "neg");
    el.textContent = text;
    $("#toasts").appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1700);
  }

  /* ---------- 数值面板 ---------- */
  function renderPanel() {
    if (!S) return;
    var h = "";
    if ((GAME.stats || []).length) {
      h += '<div class="p-sec">属性</div>';
      GAME.stats.forEach(function (d) {
        var v = S.stats[d.key], m = d.max || 100;
        var pct = Math.max(0, Math.min(100, v / m * 100));
        h += '<div class="p-row"><span>' + d.name + '</span><span class="p-val">' + v + '</span></div>';
        h += '<div class="p-bar"><i style="width:' + pct + '%"></i></div>';
      });
    }
    if ((GAME.affinity || []).length) {
      h += '<div class="p-sec">好感</div>';
      GAME.affinity.forEach(function (d) {
        h += '<div class="p-row"><span>' + d.name + '</span><span class="p-val">' + S.affinity[d.key] + '</span></div>';
      });
    }
    h += '<div class="p-sec">旗标</div>';
    var got = (GAME.flags || []).filter(function (f) { return S.flags[flagKey(f)]; });
    if (got.length) {
      h += got.map(function (f) { return '<span class="p-tag">' + flagName(flagKey(f)) + '</span>'; }).join("");
    } else {
      h += '<span class="p-none">暂无</span>';
    }
    $("#panel-body").innerHTML = h;
  }

  /* ---------- 背景与转场 ---------- */
  function setBg(sc) {
    if (!sc.bg) return;
    var css = sc.bg.indexOf("gradient(") >= 0 ? sc.bg : 'url("' + sc.bg + '")';
    var t = sc.transition || CFG.transition || "fade";
    var next = bgLayers[1 - bgActive], curL = bgLayers[bgActive];
    next.style.backgroundImage = css;
    next.style.zIndex = 2;
    curL.style.zIndex = 1;
    next.className = "bg";
    void next.offsetWidth;            /* 强制重排，保证动画可重触发 */
    next.className = "bg on t-" + t;
    setTimeout(function () { curL.className = "bg"; }, 1100);
    bgActive = 1 - bgActive;
  }

  /* ---------- 立绘槽位 ---------- */
  function setSprites(sc) {
    if (!("sprites" in sc)) return;   /* 未声明则沿用上一场景 */
    var sp = sc.sprites || {};
    ["left", "center", "right"].forEach(function (pos) {
      var slot = $("#sp-" + pos);
      var src = sp[pos];
      if (src) {
        slot.onerror = function () { slot.classList.remove("show"); };
        slot.src = src;
        slot.classList.add("show");
      } else {
        slot.classList.remove("show");
        slot.removeAttribute("src");
      }
    });
  }

  /* ---------- 强调动效：[shake] / [flash] ---------- */
  function triggerFx(name) {
    if (name === "shake") {
      var d = $("#dialog");
      d.classList.remove("shake");
      void d.offsetWidth;
      d.classList.add("shake");
    } else if (name === "flash") {
      var f = $("#flash");
      f.classList.remove("go");
      void f.offsetWidth;
      f.classList.add("go");
    }
  }

  /* ---------- 打字机：文本切分为 文字段 与 动效标记 ---------- */
  function parseSegments(text) {
    var parts = String(text).split(/(\[shake\]|\[flash\])/);
    var segs = [];
    parts.forEach(function (p) {
      if (p === "[shake]") segs.push({ fx: "shake" });
      else if (p === "[flash]") segs.push({ fx: "flash" });
      else if (p) segs.push({ txt: p });
    });
    return segs;
  }

  function typeText(text, done) {
    clearTimeout(typeTimer);
    var segs = parseSegments(text);
    pendingPlain = segs.filter(function (s) { return s.txt; })
                       .map(function (s) { return s.txt; }).join("");
    typeCb = done;
    typing = true;
    var el = $("#dlg-text");
    el.textContent = "";
    var si = 0, ci = 0, my = seq;

    function step() {
      if (seq !== my || !typing) return;
      if (si >= segs.length) { finishType(); return; }
      var seg = segs[si];
      if (seg.fx) { triggerFx(seg.fx); si++; step(); return; }
      el.textContent += seg.txt.charAt(ci++);
      if (ci >= seg.txt.length) { si++; ci = 0; }
      typeTimer = setTimeout(step, isFast() ? 6 : (CFG.typeSpeed || 30));
    }
    step();
  }

  /* 立即完成打字（点击跳过 / 快进） */
  function finishType() {
    if (!typing) return;
    typing = false;
    clearTimeout(typeTimer);
    $("#dlg-text").textContent = pendingPlain;
    var cb = typeCb;
    typeCb = null;
    if (cb) cb();
  }

  /* ---------- 场景推进 ---------- */
  function showScene(id, opts) {
    opts = opts || {};
    if (id === "END") { doEnding(); return; }
    var sc = sceneMap[id];
    if (!sc) { console.error("场景不存在: " + id); return; }
    cur = sc;
    var my = ++seq;

    if (sc.effects && !opts.silent) applyEffects(sc.effects);
    S.scene = id;
    save();

    setBg(sc);
    setSprites(sc);

    var nb = $("#namebox");
    if (sc.speaker) { nb.textContent = sc.speaker; nb.classList.add("show"); }
    else { nb.classList.remove("show"); }

    var ch = $("#choices");
    ch.innerHTML = "";
    ch.classList.remove("show");
    $("#next-hint").classList.remove("show");

    typeText(sc.text || "", function () {
      if (seq !== my) return;
      if (sc.choices && sc.choices.length) renderChoices(sc);
      else $("#next-hint").classList.add("show");
    });
  }

  function renderChoices(sc) {
    var box = $("#choices");
    box.innerHTML = "";
    sc.choices.forEach(function (c) {
      var ok = evalCond(c.cond);
      var mode = c.condMode || CFG.condMode || "hide";
      if (!ok && mode === "hide") return;
      var b = document.createElement("button");
      b.className = "choice" + (ok ? "" : " locked");
      b.textContent = (ok ? "" : "〔未达成〕") + c.text;
      if (ok) {
        b.onclick = function (e) {
          e.stopPropagation();
          pickChoice(c);
        };
      } else {
        b.disabled = true;
      }
      box.appendChild(b);
    });
    box.classList.add("show");
  }

  function pickChoice(c) {
    applyEffects(c.effects);
    if (c.check) { doCheck(c.check); return; }
    if (c.goto) showScene(c.goto);
  }

  /* 无选项场景的推进 */
  function advance() {
    if (!cur) return;
    if (typing) { finishType(); return; }
    if (cur.choices && cur.choices.length) return;   /* 有选项必须点选项 */
    var nx = cur.next;
    if (!nx) return;
    if (nx === "END") doEnding();
    else showScene(nx);
  }

  /* ---------- 属性检定：属性值 + 随机骰(1..rand) 对抗难度 ---------- */
  function doCheck(c) {
    var def = null;
    (GAME.stats || []).forEach(function (d) { if (d.key === c.stat) def = d; });
    var name = (def && def.name) || c.stat;
    var base = S.stats[c.stat] || 0;
    var roll = 1 + Math.floor(Math.random() * (c.rand || 20));
    var total = base + roll;
    var ok = total >= c.difficulty;

    $("#check-title").textContent = name + " 检定";
    $("#check-detail").textContent =
      name + " " + base + " + 骰点 " + roll + " = " + total + "（难度 " + c.difficulty + "）";
    var r = $("#check-result");
    r.textContent = ok ? "检定成功" : "检定失败";
    r.className = ok ? "ok" : "bad";
    $("#check-modal").classList.add("show");

    $("#check-go").onclick = function (e) {
      e.stopPropagation();
      $("#check-modal").classList.remove("show");
      applyEffects(ok ? c.successEffects : c.failEffects);
      showScene(ok ? c.success : c.fail);
    };
  }

  /* ---------- 结局裁定：满足 cond 者取 weight 最高 ---------- */
  function judgeEnding() {
    var best = null;
    (GAME.endings || []).forEach(function (e) {
      if (evalCond(e.cond)) {
        if (!best || (e.weight || 0) > (best.weight || 0)) best = e;
      }
    });
    return best;
  }

  function recapHTML() {
    var h = "";
    if ((GAME.stats || []).length) {
      h += '<div class="r-sec">最终属性</div>';
      h += GAME.stats.map(function (d) { return d.name + " " + S.stats[d.key]; }).join(" · ");
    }
    if ((GAME.affinity || []).length) {
      h += '<div class="r-sec">最终好感</div>';
      h += GAME.affinity.map(function (d) { return d.name + " " + S.affinity[d.key]; }).join(" · ");
    }
    var got = (GAME.flags || []).filter(function (f) { return S.flags[flagKey(f)]; });
    h += '<div class="r-sec">达成旗标</div>';
    h += got.length ? got.map(function (f) { return flagName(flagKey(f)); }).join(" · ") : "无";
    return h;
  }

  function doEnding() {
    seq++;
    typing = false;
    clearTimeout(typeTimer);
    var e = judgeEnding();
    clearSave();
    $("#end-title").textContent = e ? e.title : "未完待续";
    $("#end-body").textContent = e ? e.body :
      "没有匹配到任何结局，请检查 endings 是否包含 cond:\"true\" 的兜底项。";
    $("#end-recap").innerHTML = recapHTML();
    switchScreen("ending-screen");
  }

  /* ---------- 屏幕切换 ---------- */
  function switchScreen(id) {
    ["title-screen", "game-screen", "ending-screen"].forEach(function (s) {
      $("#" + s).classList.toggle("active", s === id);
    });
  }

  function showTitle() {
    switchScreen("title-screen");
    $("#btn-continue").style.display = loadSave() ? "" : "none";
  }

  function startNew() {
    S = newState();
    fastToggle = false;
    $("#fast-tip").classList.remove("show");
    renderPanel();
    switchScreen("game-screen");
    showScene(S.scene);
  }

  function continueGame() {
    var st = loadSave();
    if (!st) { startNew(); return; }
    S = st;
    fastToggle = false;
    $("#fast-tip").classList.remove("show");
    renderPanel();
    switchScreen("game-screen");
    showScene(S.scene, { silent: true });   /* 读档回到场景，不重复触发进场 effects */
  }

  /* ---------- 输入绑定 ---------- */
  $("#btn-start").onclick = startNew;
  $("#btn-continue").onclick = continueGame;
  $("#btn-restart").onclick = startNew;
  $("#btn-title").onclick = showTitle;

  /* 单击推进：打字中则先跳过 */
  $("#game-screen").addEventListener("click", function () {
    if ($("#check-modal").classList.contains("show")) return;
    if (typing) { finishType(); return; }
    advance();
  });

  /* 双击切换快进 */
  $("#game-screen").addEventListener("dblclick", function () {
    fastToggle = !fastToggle;
    $("#fast-tip").classList.toggle("show", fastToggle);
  });

  /* 面板开关（阻止冒泡，避免推进剧情） */
  $("#hud-btn").addEventListener("click", function (e) {
    e.stopPropagation();
    renderPanel();
    $("#panel").classList.toggle("show");
  });
  $("#panel").addEventListener("click", function (e) { e.stopPropagation(); });
  $("#check-modal").addEventListener("click", function (e) { e.stopPropagation(); });

  /* 键盘：Ctrl 按住快进，空格 / 回车推进 */
  document.addEventListener("keydown", function (e) {
    if (e.key === "Control") fastHold = true;
    if ((e.key === " " || e.key === "Enter") &&
        $("#game-screen").classList.contains("active") &&
        !$("#check-modal").classList.contains("show")) {
      e.preventDefault();
      if (typing) finishType();
      else advance();
    }
  });
  document.addEventListener("keyup", function (e) {
    if (e.key === "Control") fastHold = false;
  });

  /* 快进主循环：每 260ms 自动推进一步（不越过选项与检定） */
  setInterval(function () {
    if (!isFast()) return;
    if (!$("#game-screen").classList.contains("active")) return;
    if ($("#check-modal").classList.contains("show")) return;
    if (typing) { finishType(); return; }
    if (cur && cur.choices && cur.choices.length) return;
    advance();
  }, 260);

  /* ---------- 启动 ---------- */
  document.title = GAME.meta.title || "视觉小说";
  $("#title-name").textContent = GAME.meta.title || "";
  $("#title-author").textContent = GAME.meta.author || "";
  $("#title-screen").style.background = GAME.meta.cover || "var(--ink)";
  $("#ending-screen").style.background = GAME.meta.cover || "var(--ink)";
  showTitle();
})();
</script>
</body>
</html>
