name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Regenerate embedded assets
        run: node scripts/gen_embedded.mjs
      - name: Check embedded asset index
        run: git diff --exit-code -- src/embedded.rs
      - name: Check formatting
        run: cargo fmt --check
      - name: Check benchmark Python
        run: python -m py_compile benchmarks/minimax-m3-smoke/grade.py benchmarks/minimax-m3-smoke/summarize.py benchmarks/minimax-m3-smoke/build_artifacts_html.py
      - name: Run tests
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
